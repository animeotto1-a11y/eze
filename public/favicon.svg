<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Circle Background -->
  <rect width="100" height="100" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Camera Aperture Blades & Crown Hybrid -->
  <g transform="translate(50, 50)" filter="url(#glow)">
    <!-- Outer Gold Ring -->
    <circle r="34" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.9" />
    <circle r="29" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />

    <!-- Aperture Blades -->
    <path d="M 0 -28 L 12 -12 L 0 -10 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M 24 -14 L 16 6 L 6 0 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M 24 14 L 4 16 L 6 6 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M 0 28 L -12 12 L 0 10 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M -24 14 L -16 -6 L -6 0 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M -24 -14 L -4 -16 L -6 -6 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Center Monogram "E" -->
    <text x="0" y="7" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="20" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">E</text>

    <!-- Small Sparkle / Royal Accent on top -->
    <circle cx="0" cy="-34" r="2.5" fill="#FDE047" />
  </g>
</svg>